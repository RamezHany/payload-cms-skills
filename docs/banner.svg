<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <!-- RH navy background -->
  <rect width="1280" height="320" fill="#03245C"/>

  <!-- hairline grid -->
  <g stroke="#E6E8ED" stroke-opacity="0.16" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="320"/>
    <line x1="1240" y1="0" x2="1240" y2="320"/>
    <line x1="0" y1="54" x2="1280" y2="54"/>
    <line x1="0" y1="262" x2="1280" y2="262"/>
  </g>

  <!-- crosshairs at grid intersections -->
  <g stroke="#0049FF" stroke-width="2">
    <path d="M32 54 h16 M40 46 v16"/>
    <path d="M1232 54 h16 M1240 46 v16"/>
    <path d="M32 262 h16 M40 254 v16"/>
    <path d="M1232 262 h16 M1240 254 v16"/>
  </g>

  <!-- top bar -->
  <text x="76" y="35" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2.5" fill="#E6E8ED">RAMEZHANY / PAYLOAD-CMS-SKILLS</text>
  <text x="1204" y="35" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2.5" fill="#E6E8ED">AGENT SKILLS // SKILL.MD</text>

  <!-- eyebrow -->
  <rect x="76" y="88" width="10" height="10" fill="#0049FF"/>
  <text x="98" y="99" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14.5" letter-spacing="2" fill="#7DA2FF">// FOR PAYLOAD CMS 3 + NEXT.JS</text>

