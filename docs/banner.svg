<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <rect width="1280" height="320" fill="#f6f1e7"/>
  <rect x="8" y="8" width="1264" height="304" fill="none" stroke="#d9d2c5" stroke-width="2"/>
  <rect x="8" y="8" width="1264" height="6" fill="#0f6e56"/>

  <!-- decorative dot grid, top right -->
  <g fill="#0f6e56" opacity="0.32">
    <circle cx="1052" cy="52" r="3.5"/><circle cx="1086" cy="52" r="3.5"/><circle cx="1120" cy="52" r="3.5"/><circle cx="1154" cy="52" r="3.5"/><circle cx="1188" cy="52" r="3.5"/>
    <circle cx="1052" cy="82" r="3.5"/><circle cx="1086" cy="82" r="3.5"/><circle cx="1120" cy="82" r="3.5"/><circle cx="1154" cy="82" r="3.5"/><circle cx="1188" cy="82" r="3.5"/>
    <circle cx="1052" cy="112" r="3.5"/><circle cx="1086" cy="112" r="3.5"/><circle cx="1120" cy="112" r="3.5"/><circle cx="1154" cy="112" r="3.5"/><circle cx="1188" cy="112" r="3.5"/>
  </g>

  <!-- eyebrow -->
  <text x="72" y="94" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="bold" letter-spacing="4" fill="#0f6e56">AGENT SKILLS · OPEN SKILL.MD FORMAT</text>

  <!-- title -->
  <text x="70" y="162" font-family="Georgia, 'Iowan Old Style', Palatino, serif" font-size="66" font-weight="bold" fill="#1c1915">Payload CMS Skills</text>

  <!-- tagline -->
