  <text x="74" y="190" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="86" font-weight="bold" letter-spacing="-1.5" fill="#FFFFFF">Payload CMS <tspan fill="#0049FF">Skills</tspan></text>

  <!-- subline -->
  <text x="76" y="232" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15.5" letter-spacing="1" fill="#E6E8ED" fill-opacity="0.85">MAKE CODING AGENTS BUILD THE SAME WAY — EVERY TIME.</text>

