  <!-- install command pill -->
  <rect x="72" y="234" width="566" height="44" rx="8" fill="#fffdf8" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="92" y="262" font-family="Consolas, 'Courier New', monospace" font-size="16.5" fill="#1c1915">$ npx skills add RamezHany/payload-cms-skills</text>

  <!-- tech chips -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c564c">
    <rect x="664" y="234" width="92" height="44" rx="22" fill="#fffdf8" stroke="#d9d2c5" stroke-width="1.5"/>
    <text x="710" y="262" text-anchor="middle">Payload 3</text>
    <rect x="766" y="234" width="80" height="44" rx="22" fill="#fffdf8" stroke="#d9d2c5" stroke-width="1.5"/>
