    <rect x="968" y="234" width="66" height="44" rx="22" fill="#fffdf8" stroke="#d9d2c5" stroke-width="1.5"/>
    <text x="1001" y="262" text-anchor="middle">Turso</text>
    <rect x="1044" y="234" width="74" height="44" rx="22" fill="#fffdf8" stroke="#d9d2c5" stroke-width="1.5"/>
